# cloudbuild-mesh.yaml — install the whole Vibeflix mesh SERVER-SIDE, in Cloud Build.
#
#     ./deploy/run_mesh_cloudbuild.sh            # submit (see that script for the IAM it needs)
#     ./deploy/run_mesh_cloudbuild.sh --resume   # continue a previous run
#
# Why this exists: the install takes the better part of an hour, and Cloud Shell cannot be
# relied on to stay alive that long — it reclaims an idle VM regardless of whether a job is
# running, and neither tmux nor nohup survives that. A build runs on Google's infrastructure,
# so nothing on your side — closed tab, dropped network, timed-out shell, closed laptop — can
# interrupt it. The logs are permanent and readable afterwards, which the terminal's are not.
#
# Everything else about the install is unchanged: this runs the SAME ./deploy/deploy_mesh.sh you would
# run by hand, so there is no second code path to keep in sync.
timeout: 10800s          # 3h. The engine deploys dominate; 1h is cutting it close on a cold project.
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY   # required when a build runs as a user-specified service account
substitutions:
  _MESH_ARGS: ''         # passed straight through, e.g. '--resume' or '--from legal'
steps:
  - id: install-mesh
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail

        echo "── preparing the build image ─────────────────────────────────"
        # The cloud-sdk image is Debian 12 (python3.11 — inside preflight's supported 3.10-3.13),
        # but ships without the handful of tools init.sh needs.
        # curl is NOT in the cloud-sdk image, and both preflight and init.sh need it (init.sh
        # downloads terraform with it). Do not silence failures here: a missing package
        # resurfaces later as "tool not found", which reads like a bug in the checker.
        apt-get update -qq >/dev/null
        apt-get install -y -qq curl ca-certificates unzip jq git python3-venv >/dev/null
        for T in curl unzip jq git; do
          command -v $$T >/dev/null || { echo "✗ $$T missing after apt-get install" >&2; exit 1; }
        done
        python3 -V
        gcloud config set project "$PROJECT_ID" -q 2>/dev/null

        # deploy/deploy_mesh.sh reads PROJECT (or gcloud config) and refuses to build into a project
        # other than the one it was asked for — set it explicitly rather than relying on the
        # build's ambient config.
        export PROJECT="$PROJECT_ID"

        # Nested builds (the 3 MCP images + the app image) are submitted from inside this one,
        # and have no default service account to fall back to on a fresh project. Hand them the
        # account this build runs as. `gcloud config get-value account` is the build SA here.
        export CLOUDBUILD_SA="$$(gcloud config get-value account 2>/dev/null)"
        echo "  nested builds will run as: $$CLOUDBUILD_SA"

        # ── restore state from an earlier build ───────────────────────
        # A build starts from a fresh source upload every time, and deploy/.env is deliberately
        # NOT uploaded (it is per-project). But init.sh mints a new TASK_STORE_KEY whenever it
        # writes that file — so a second build would hand the remaining agents a DIFFERENT key
        # from the ones the first build already deployed, and the shared A2A task store would
        # start rejecting them. RAG_CORPUS lives there too, and .mesh_state is what --resume
        # reads. So carry all three across builds.
        STATE="gs://$PROJECT_ID-artifacts/mesh-state"
        echo "── restoring state from $$STATE (if any) ─────────────────────"
        gcloud storage cp "$$STATE/env" deploy/.env 2>/dev/null && echo "  ✓ deploy/.env" || echo "  · no saved deploy/.env (first build)"
        gcloud storage cp "$$STATE/agent_identities.json" deploy/ 2>/dev/null && echo "  ✓ agent_identities.json" || true
        gcloud storage cp "$$STATE/mesh_state" .mesh_state 2>/dev/null && echo "  ✓ .mesh_state ($$(cat .mesh_state))" || true
        # TERRAFORM STATE. Each build gets a clean workspace, and the state files are not in the
        # source upload (they are per-project). Without this a SECOND build has no record of the
        # Artifact Registry repo, topic and Cloud Run services the first one created, so
        # `terraform apply` tries to create them again and fails on ALREADY_EXISTS — the resume
        # path breaks on resources that are perfectly healthy.
        for TFDIR in foundations mcp; do
          gcloud storage cp "$$STATE/tfstate-$$TFDIR" "deploy/terraform/$$TFDIR/terraform.tfstate" 2>/dev/null             && echo "  ✓ terraform state ($$TFDIR)" || true
        done

        echo "── ./deploy/deploy_mesh.sh ${_MESH_ARGS} ────────────────────────────"
        ./deploy/deploy_mesh.sh ${_MESH_ARGS}
        rc=$$?

        # Upload the per-phase logs whether we passed or FAILED — a failed build is exactly when
        # you want them, and Cloud Build has no always-run step, so this has to live in the same
        # step as the thing that fails.
        # ── save state + logs, pass or FAIL ───────────────────────────
        # Cloud Build has no always-run step, so this lives in the same step as the thing that
        # fails. A failed build is precisely when the next run needs the state and you need
        # the logs.
        echo "── saving state ──────────────────────────────────────────────"
        gcloud storage cp deploy/.env "$$STATE/env" 2>/dev/null && echo "  ✓ deploy/.env saved" || true
        gcloud storage cp deploy/agent_identities.json "$$STATE/agent_identities.json" 2>/dev/null || true
        gcloud storage cp .mesh_state "$$STATE/mesh_state" 2>/dev/null || true
        for TFDIR in foundations mcp; do
          [ -f "deploy/terraform/$$TFDIR/terraform.tfstate" ]             && gcloud storage cp "deploy/terraform/$$TFDIR/terraform.tfstate" "$$STATE/tfstate-$$TFDIR" 2>/dev/null             && echo "  ✓ terraform state saved ($$TFDIR)" || true
        done

        echo "── uploading per-phase logs ──────────────────────────────────"
        if [ -d logs ]; then
          gcloud storage cp -r logs "gs://$PROJECT_ID-artifacts/mesh-logs/$BUILD_ID/" 2>/dev/null \
            && echo "  logs → gs://$PROJECT_ID-artifacts/mesh-logs/$BUILD_ID/" \
            || echo "  (no artifacts bucket yet — the phase logs are inline in this build log)"
        fi
        exit $$rc
