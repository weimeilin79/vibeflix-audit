# Agent Gateway access policies — deny-by-default tool allowlists.
#
# ENFORCEMENT (per the Agent Gateway codelab): each row becomes an IAP EGRESS
# grant — `roles/iap.egressor` bound to the agent's identity principal
# (deploy/agent_identities.json) with a CEL condition scoping it. Verified
# attribute keys (codelab-verbatim; casing is Google's):
#   tool allowlist:  api.getAttribute('iap.googleapis.com/mcp.toolName', '') in ['t1', 't2']
#   read-only:       api.getAttribute('iap.googleapis.com/mcp.tool.isReadOnly', false) == true
# There is NO documented mcp.server attribute — scoping is by tool name, which
# is equivalent here (tool names are unique across the three vibeflix servers).
# Applied via deploy/grant_mcp_egress.sh (driven by setup_gateway.sh step 3).

policies:
  - caller: vibeflix-brand-style
    mcp_server: vibeflix-mcp-brand-style
    allow_tools: [run_brand_audit]

  - caller: vibeflix-deal-pricing
    mcp_server: vibeflix-mcp-licensing
    allow_tools: [get_license_pricing]

  - caller: vibeflix-vendor-clearance
    mcp_server: vibeflix-mcp-licensing
    allow_tools:
      - get_vendor
      - find_vendors
      - create_vendor        # onboarding
      - update_vendor        # category add
      - list_trademarks
      - verify_trademark_record
      - scan_global_exclusivity_clauses
      - check_vendor_eligibility
  - caller: vibeflix-vendor-clearance
    mcp_server: vibeflix-mcp-market
    allow_tools: [scan_ecom_marketplaces, check_sku_volume_caps, capture_audit_map]

  - caller: vibeflix-legal
    mcp_server: vibeflix-mcp-licensing
    allow_tools:
      - get_vendor
      - verify_trademark_record
      - scan_global_exclusivity_clauses
      - upsert_contract      # legal is the ONLY contract writer
      - get_contract

  # The console app: pickers, note_responder, Database tab, contract reads +
  # the volume annotation. Read-only except upsert_contract (administrative
  # production_volume stamp) and reset_vendors (the demo Reset button).
  - caller: vibeflix-app
    mcp_server: vibeflix-mcp-licensing
    allow_tools:
      - list_trademarks
      - get_vendor
      - find_vendors
      - verify_trademark_record
      - scan_global_exclusivity_clauses
      - get_contract
      - upsert_contract
      - dump_stores
      - reset_vendors

# ---------------------------------------------------------------------------
# A2A (agent-to-agent) egress — the gateway governs these too ("all HTTP-based
# traffic, including MCP and A2A"). Deny-by-default: an agent not granted
# egress to another agent CANNOT call it. This codifies the mesh's one
# private hand-off: ONLY vendor_clearance may invoke legal.
# Requires the target agent registered in Agent Registry (agents register like
# MCP servers, via --agent-spec-type on `agent-registry services create`).
# NOTE: the A2A destination attribute key isn't documented yet (verified MCP
# keys: mcp.toolName, mcp.tool.isReadOnly) — discover it from the gateway's IAP
# request logs on the first live call, then grant.
a2a_policies:
  - caller: vibeflix-vendor-clearance
    target_agent: vibeflix-legal
