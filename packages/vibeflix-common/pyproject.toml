[project]
name = "vibeflix-common"
version = "0.1.0"
description = "Shared helpers for the Vibeflix audit mesh (agents + MCP servers)."
requires-python = ">=3.11"
# Core deps are none — each service installs the extra it needs so agents don't
# pull firestore and MCP servers don't pull google-adk.
dependencies = []

[project.optional-dependencies]
# Agent services (brand_style/ip_counsel/storyline) + the app/orchestrator.
agents = [
    "google-adk[a2a]==2.3.0",  # pinned — newer pre-releases move McpToolset
    "google-genai>=1.0.0",
    "mcp>=1.0,<2",  # --pre would pull mcp 2.0.0b1 (drops mcp.types) — cap below 2

    "python-dotenv>=1.0.0",
    "uvicorn>=0.28.0",
    "aiohttp>=3.9.0",
]
# MCP servers (registry helper → Firestore, with hardcoded fallback).
mcp = [
    "google-cloud-firestore>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vibeflix_common*"]
