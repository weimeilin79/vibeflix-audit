# Local 7-service topology for the Vibeflix audit mesh.
#
#   app            frontend + FastAPI + Sourcing Orchestrator (A2A client)   :8000
#   brand_style    Brand Style agent  (A2A server)                           :8001
#   vendor_clearance  Vendor & Licensing Clearance agent (A2A server)        :8002
#   deal_pricing   Deal Pricing agent (A2A server)                           :8003
#   mcp_licensing  Vendor & licensing registry MCP server (streamable-http)  :9002
#   mcp_market     Market & telemetry MCP server (streamable-http)           :9003
#
# Only `app` is published to the host. Services reach each other by name.
# The agents call Gemini on Vertex AI; they use your local Application Default
# Credentials, mounted read-only. Run `gcloud auth application-default login`
# first.  Bring it up:  docker compose up --build

# Shared Vertex AI configuration for the agent services AND the app container
# (the app runs the in-process UI-Render presenter, which calls Gemini).
x-vertex-env: &vertex-env
  # Local mesh: plain http between containers, no credentials on any hop.
  # The CLOUD deployment sets RUN_LOCAL=false → vibeflix_common.cloud_auth
  # attaches Google tokens to every MCP + A2A call (see deploy/instruction-*.md).
  RUN_LOCAL: "true"
  GOOGLE_CLOUD_PROJECT: pokedemo-test
  GOOGLE_CLOUD_LOCATION: global
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  # Live mesh telemetry: workflow nodes + MCP tools publish started/completed
  # events here (vibeflix_common.telemetry; unset → telemetry no-ops).
  PUBSUB_TOPIC: ${PUBSUB_TOPIC:-vibeflix-mesh-events}

# Mount local gcloud ADC into agent containers so Vertex calls authenticate.
x-gcloud-adc: &gcloud-adc
  - ${HOME}/.config/gcloud:/root/.config/gcloud:ro

# Firestore-backed semantic registries for the MCP servers. Leave FIRESTORE_DATABASE
# unset → hardcoded fallback (mesh works with no Firestore); set it (e.g.
# `FIRESTORE_DATABASE=vibeflix-registry docker compose up`) to read/edit live.
x-registry-env: &registry-env
  GOOGLE_CLOUD_PROJECT: pokedemo-test
  FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-}
  PUBSUB_TOPIC: ${PUBSUB_TOPIC:-vibeflix-mesh-events}

services:
  # ---- MCP servers (one per functional group) ----
  # Vendor & Licensing Clearance registry. VENDORS are Firestore-backed CRUD
  # (collection `vendors`, auto-seeded from the in-code defaults on first use) so
  # onboarded vendors/categories survive restarts; trademarks/exclusivity/contracts
  # stay in-memory. Unset FIRESTORE_DATABASE → fully in-memory fallback.
  mcp_licensing:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mcp
      args: { GROUP: mcp_licensing }
    environment:
      <<: *registry-env
      FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-vibeflix-registry}
      MCP_TRANSPORT: streamable-http
      HOST: 0.0.0.0
      PORT: "9002"
    volumes: *gcloud-adc

  mcp_market:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mcp
      args: { GROUP: mcp_market }
    environment:
      <<: *registry-env
      MCP_TRANSPORT: streamable-http
      HOST: 0.0.0.0
      PORT: "9003"
    volumes: *gcloud-adc

  mcp_brand_style:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mcp
      args: { GROUP: mcp_brand_style }
    environment:
      <<: *registry-env
      MCP_TRANSPORT: streamable-http
      HOST: 0.0.0.0
      PORT: "9004"
    volumes: *gcloud-adc

  # ---- Domain agents (A2A servers) — each a self-contained per-agent image ----
  brand_style:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
      args: { AGENT: brand_style }
    environment:
      <<: *vertex-env
      A2A_AGENT: brand_style
      A2A_HOST: brand_style
      A2A_PROTOCOL: http
      PORT: "8001"
      # Deterministic branding checks live on mcp_brand_style; the agent does the
      # extraction itself (Vertex vision).
      MCP_BRAND_STYLE_URL: http://mcp_brand_style:9004/mcp
    volumes: *gcloud-adc
    depends_on: [mcp_brand_style]

  vendor_clearance:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
      args: { AGENT: vendor_clearance }
    environment:
      <<: *vertex-env
      A2A_AGENT: vendor_clearance
      A2A_HOST: vendor_clearance
      A2A_PROTOCOL: http
      PORT: "8002"
      MCP_LICENSING_URL: http://mcp_licensing:9002/mcp
      MCP_MARKET_URL: http://mcp_market:9003/mcp
      # Private handoff to the independent Legal Clearance agent (below).
      LEGAL_A2A_URL: http://legal:8005
    volumes: *gcloud-adc
    depends_on: [mcp_licensing, mcp_market, legal]

  # ---- Legal Clearance agent (A2A server) — INDEPENDENT + private to vendor_clearance
  #      (not in the orchestrator fan-out). Self-loops to clear a vendor's legal work
  #      for a newly-onboarded category; writes the contract to mcp_licensing. ----
  legal:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
      args: { AGENT: legal }
    environment:
      <<: *vertex-env
      A2A_AGENT: legal
      A2A_HOST: legal
      A2A_PROTOCOL: http
      PORT: "8005"
      MCP_LICENSING_URL: http://mcp_licensing:9002/mcp
      # Legal knowledge base (search_legal_docs). Local keyword retriever over the
      # mounted docs by default; set RAG_CORPUS (from deploy/setup_legal_rag.py) to use
      # Vertex AI RAG Engine instead.
      LEGAL_DOCS_DIR: /app/legal-docs
      # Vertex AI RAG Engine corpus (from deploy/setup_legal_rag.py). Set → search_legal_docs
      # uses Vertex retrieval; unset → the local keyword retriever over LEGAL_DOCS_DIR.
      RAG_CORPUS: ${RAG_CORPUS:-}
      RAG_LOCATION: ${RAG_LOCATION:-us-central1}
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      - ./resource/legal/docs:/app/legal-docs:ro
    depends_on: [mcp_licensing]

  deal_pricing:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
      args: { AGENT: deal_pricing }
    environment:
      <<: *vertex-env
      A2A_AGENT: deal_pricing
      A2A_HOST: deal_pricing
      A2A_PROTOCOL: http
      PORT: "8003"
      # deal_pricing's reasoner calls mcp_licensing.get_license_pricing for the rate card.
      MCP_LICENSING_URL: http://mcp_licensing:9002/mcp
    volumes: *gcloud-adc
    depends_on: [mcp_licensing]

  # ---- UI-Render agent (A2A server) — turns reports → A2UI panels via Gemini.
  #      Its own instance like the domain agents; no MCP, needs Vertex + ADC. ----
  ui_renderer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
      args: { AGENT: ui_renderer }
    environment:
      <<: *vertex-env
      A2A_AGENT: ui_renderer
      A2A_HOST: ui_renderer
      A2A_PROTOCOL: http
      PORT: "8004"
    volumes: *gcloud-adc

  # ---- Orchestrator agent (A2A server) — INDEPENDENT, exactly like the cloud engine.
  #      The app is a THIN CLIENT: it calls this over A2A (same as ui_renderer) rather
  #      than importing root_agent and running the workflow in-process. That keeps local
  #      and cloud topologies identical — and in cloud it is what gives the orchestrator
  #      its own agent identity, its own gateway-governed egress, and its own traces. ----
  orchestrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
      args: { AGENT: orchestrator }
    environment:
      <<: *vertex-env
      A2A_AGENT: orchestrator
      A2A_HOST: orchestrator
      A2A_PROTOCOL: http
      PORT: "8006"
      # It fans out to the three domain agents over A2A …
      BRAND_STYLE_A2A_URL: http://brand_style:8001
      VENDOR_CLEARANCE_A2A_URL: http://vendor_clearance:8002
      DEAL_PRICING_A2A_URL: http://deal_pricing:8003
      # … and reads the rate card / trademarks for its own steps.
      MCP_LICENSING_URL: http://mcp_licensing:9002/mcp
    volumes: *gcloud-adc
    depends_on: [brand_style, vendor_clearance, deal_pricing, mcp_licensing]

  # ---- App: frontend + FastAPI. A THIN CLIENT — it calls the orchestrator and the
  #      ui_renderer over A2A, and runs no agent workflow itself. ----
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      # Local app resolves no engine URL, so it uses in-memory recall — skip the heavy
      # google-cloud-aiplatform tree the `gcp` extra pulls. Cloud builds default WITH_GCP=1.
      args: { WITH_GCP: "0" }
    ports: ["8000:8000"]
    environment:
      # The app no longer calls Gemini itself — the ui_renderer service does.
      # vertex-env (GOOGLE_CLOUD_PROJECT) + the ADC mount are still needed for the
      # image upload to GCS (and Vertex persistence when AGENT_ENGINE_ID is set).
      <<: *vertex-env
      PORT: "8000"
      # The INDEPENDENT orchestrator agent — the app calls it over A2A (thin client).
      # Its presence is what switches the app off the in-process workflow: unset it and
      # the app falls back to importing root_agent and running the graph itself.
      ORCHESTRATOR_A2A_URL: http://orchestrator:8006
      # Domain-agent URLs: still passed so the app can PROBE them for /api/ready
      # (the fan-out itself is the orchestrator's job now, not the app's).
      BRAND_STYLE_A2A_URL: http://brand_style:8001
      VENDOR_CLEARANCE_A2A_URL: http://vendor_clearance:8002
      DEAL_PRICING_A2A_URL: http://deal_pricing:8003
      # The UI-Render agent (paints reports → A2UI panels).
      UI_RENDERER_A2A_URL: http://ui_renderer:8004
      # Read-only: the app pulls the licensed-trademark list (list_trademarks) to
      # populate the character/trademark picker, and lists every server's tools
      # (/api/mcp/tools) for the Workflow graph's tool LEDs.
      MCP_LICENSING_URL: http://mcp_licensing:9002/mcp
      MCP_BRAND_STYLE_URL: http://mcp_brand_style:9004/mcp
      MCP_MARKET_URL: http://mcp_market:9003/mcp
      # Bucket for vendor image uploads (/api/upload).
      REQUEST_IMAGE_BUCKET: vibeflix-request-image
      # Audit history: stored in Firestore (collection `audit_history` in this named
      # db) when reachable; the mounted JSONL below is the offline fallback.
      FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-vibeflix-registry}
      # Live-telemetry bridge (/api/mesh/events): streaming pull from this
      # subscription, fanned out to the console over SSE (tool LEDs, node states).
      PUBSUB_SUBSCRIPTION: ${PUBSUB_SUBSCRIPTION:-vibeflix-mesh-events-app}
      AUDIT_HISTORY_DIR: /app/data
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      - ./data/app:/app/data
    depends_on: [orchestrator, ui_renderer, mcp_licensing]
